name: Auto-Update Job Boards

on:
  schedule:
    # Every 2 days at 2:30 AM UTC (8:00 AM IST)
    - cron: '30 2 */2 * *'
  workflow_dispatch:    # Allow manual trigger for testing

jobs:
  update-boards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup git config
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Fetch and update job boards
        id: fetch_boards
        run: |
          # Load configuration
          SOURCES_CONFIG=$(cat data/board_sources.json)
          CURRENT_BOARDS=$(cat data/boards.json)

          echo "🔍 Starting board update process..."
          echo "Current greenhouse boards: $(echo "$CURRENT_BOARDS" | node -e "const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf-8')); console.log(d.greenhouse.length)")"

          # Check each source type
          GREENHOUSE_TYPE=$(echo "$SOURCES_CONFIG" | node -e "const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf-8')); console.log(d.sources.greenhouse.type)")

          if [ "$GREENHOUSE_TYPE" = "manual" ]; then
            echo "✅ Manual mode: No external fetch needed"
            NEW_BOARDS="$CURRENT_BOARDS"
          elif [ "$GREENHOUSE_TYPE" = "api" ]; then
            API_URL=$(echo "$SOURCES_CONFIG" | node -e "const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf-8')); console.log(d.sources.greenhouse.api_url)")
            echo "🌐 Fetching from API: $API_URL"

            # Fetch boards from API
            RESPONSE=$(curl -s -X POST "$API_URL" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${{ secrets.BOARD_API_KEY }}" \
              -d '{}')

            # Transform response based on configuration
            NEW_BOARDS=$(echo "$RESPONSE" | node -e "
              const d = JSON.parse(require('fs').readFileSync('/dev/stdin', 'utf-8'));
              const current = JSON.parse(process.argv[1]);
              const newBoards = d.boards || [];

              // Merge and deduplicate
              const merged = [...new Set([...current.greenhouse, ...newBoards])];

              console.log(JSON.stringify({
                greenhouse: merged,
                lever: current.lever,
                worker_limit: current.worker_limit
              }));
            " "$CURRENT_BOARDS")

            echo "✅ Fetched ${#newBoards[@]} new boards from API"
          fi

          # Update current boards with new data
          UPDATED_BOARDS=$(echo "$NEW_BOARDS" | node -e "
            const d = JSON.parse(require('fs').readFileSync('/dev/stdin', 'utf-8'));
            const current = JSON.parse(process.argv[1]);

            // Merge and deduplicate
            const mergedGreenhouse = [...new Set([...current.greenhouse, ...d.greenhouse])];
            const mergedLever = [...new Set([...current.lever, ...d.lever])];

            console.log(JSON.stringify({
              greenhouse: mergedGreenhouse,
              lever: mergedLever,
              worker_limit: current.worker_limit
            }));
          " "$CURRENT_BOARDS")

          # Write updated boards to file
          echo "$UPDATED_BOARDS" > data/boards.json

          # Count changes
          OLD_COUNT=$(echo "$CURRENT_BOARDS" | node -e "const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf-8')); console.log(d.greenhouse.length)")
          NEW_COUNT=$(echo "$UPDATED_BOARDS" | node -e "const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf-8')); console.log(d.greenhouse.length)")

          echo "Board count changed from $OLD_COUNT to $NEW_COUNT"
          if [ "$NEW_COUNT" != "$OLD_COUNT" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Validate boards.json
        run: |
          if ! node -e "JSON.parse(require('fs').readFileSync('data/boards.json', 'utf-8'))"; then
            echo "❌ Invalid JSON in data/boards.json"
            exit 1
          fi
          echo "✅ boards.json is valid"

          # Show current board counts
          node -e "
            const data = JSON.parse(require('fs').readFileSync('data/boards.json', 'utf-8'));
            console.log('📊 Current Boards:');
            console.log('  Greenhouse:', data.greenhouse.length);
            console.log('  Lever:', data.lever.length);
            console.log('  Worker Limit:', data.worker_limit);
            console.log('');
            console.log('🏢 Top 10 Companies:');
            data.greenhouse.slice(0, 10).forEach((company, i) => console.log('  ' + (i+1) + '. ' + company));
          "

      - name: Check for changes
        id: check_changes
        run: |
          # Create a temp file to compare
          cp data/boards.json /tmp/boards_current.json

          if git diff --quiet data/boards.json; then
            echo "✅ No changes to boards.json - nothing to commit"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "🔄 Changes detected in boards.json"
            git diff data/boards.json | head -50
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit updated boards
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git add data/boards.json
          git commit -m "Auto-update job boards ($(date +'%Y-%m-%d %H:%M:%S'))"
          git push
          echo "✅ Boards updated and committed to git"

      - name: Update Cloudflare Worker config
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          echo "🚀 Updating Cloudflare Worker configuration..."

          # Read boards.json and extract the greenhouse array
          BOARDS=$(cat data/boards.json)
          WORKER_LIMIT=$(echo "$BOARDS" | node -e "const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf-8')); console.log(d.worker_limit || 20)")

          # Call the Worker's config API
          curl -s -X POST https://job-agent-web.clinton-s-almeida.workers.dev/api/config \
            -H "Content-Type: application/json" \
            -d "{
              \"greenhouse\": $(echo "$BOARDS" | node -e "const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf-8')); console.log(JSON.stringify(d.greenhouse))"),
              \"lever\": $(echo "$BOARDS" | node -e "const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf-8')); console.log(JSON.stringify(d.lever))"),
              \"worker_limit\": $WORKER_LIMIT
            }" || echo "⚠️ Worker config update failed (non-critical)"

          echo "✅ Worker configuration updated successfully"

      - name: Send notification on failure
        if: failure()
        run: |
          echo "⚠️ Auto-update workflow failed. Check GitHub Actions logs."
          # You can add Slack/email notifications here
          # curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
          #   -H "Content-Type: application/json" \
          #   -d '{"text": "❌ Job board update failed. Check GitHub Actions: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'

      - name: Send success notification
        if: success()
        run: |
          echo "✅ Job boards auto-update completed successfully"
          echo "Next run: Every 2 days at 8:00 AM IST"
          echo "Dashboard: https://job-agent-web.clinton-s-almeida.workers.dev"
