<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Job Agent</title>
  <link rel="stylesheet" href="/styles.css?t=__STYLES_VERSION__"/>
</head>
<body>
  <!-- Top Bar -->
  <header class="topbar">
    <div class="topbar-brand">
      <h1>Job Agent</h1>
      <div class="topbar-meta">
        <span class="live-dot"></span>
        <span id="topbarMatched">— matched</span>
        <span class="dot"></span>
        <span id="topbarTotal">— total</span>
        <span class="dot"></span>
        <span id="utcTime">--:-- UTC</span>
      </div>
    </div>
    <div class="topbar-actions">
      <button id="scrapeBtn" class="btn btn-primary">Scrape Now</button>
      <button id="profileBtn" class="btn btn-ghost">Profile</button>
    </div>
  </header>

  <!-- Stat Strip -->
  <div class="stat-strip">
    <div class="stat-cell"><span class="num">—</span><span class="label">total jobs</span></div>
    <div class="stat-cell"><span class="num accent">—</span><span class="label">new</span></div>
    <div class="stat-cell"><span class="num amber">—</span><span class="label">saved</span></div>
    <div class="stat-cell"><span class="num green">—</span><span class="label">applied</span></div>
    <div class="stat-cell"><span class="num red">—</span><span class="label">skipped</span></div>
    <div class="stat-cell"><span class="num" style="color:var(--muted)">—</span><span class="label">ignored</span></div>
  </div>

  <!-- Filter Bar -->
  <div class="filter-bar">
    <select id="statusFilter" title="Filter by status" aria-label="Filter by status">
      <option value="new">New Jobs</option>
      <option value="saved">Saved</option>
      <option value="applied">Applied</option>
      <option value="skipped">Skipped</option>
      <option value="ignored">Ignored</option>
    </select>
    <select id="companyFilter" title="Filter by company" aria-label="Filter by company">
      <option value="">All Companies</option>
    </select>
    <select id="regionFilter" title="Filter by region" aria-label="Filter by region">
      <option value="">All Regions</option>
      <option value="india">India</option>
      <option value="remote">Remote</option>
      <option value="usa">USA</option>
      <option value="europe">Europe</option>
      <option value="asia-pacific">Asia-Pacific</option>
    </select>
    <select id="jobTypeFilter" title="Filter by job type" aria-label="Filter by job type">
      <option value="">All Types</option>
      <option value="remote">Remote Only</option>
      <option value="onsite">On-site Only</option>
    </select>
    <select id="sourceFilter" title="Filter by source" aria-label="Filter by source">
      <option value="">All Sources</option>
    </select>
    <select id="sortFilter" title="Sort by" aria-label="Sort by">
      <option value="score">Score (desc)</option>
      <option value="posted">Newest</option>
    </select>
    <div class="spacer"></div>
    <input id="searchInput" type="text" placeholder="Search title, company..."/>
    <button id="clearFilters" class="btn btn-ghost" style="display:none">Clear</button>
  </div>

  <!-- Job List Header -->
  <div class="list-header">
    <span>Job</span>
    <span>Details</span>
    <span>Score</span>
    <span>Actions</span>
  </div>

  <!-- Job List -->
  <div class="job-list" id="jobQueue">
    <div class="empty-state"><p>Loading jobs...</p></div>
  </div>

  <!-- Profile Modal -->
  <div id="profileModal" class="modal" style="display:none" role="dialog" aria-modal="true" aria-label="Edit profile">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Edit profile</h2>
        <button id="closeProfileBtn" class="close" aria-label="Close dialog">&times;</button>
      </div>
      <form id="profileForm">
        <div class="form-grid">
          <label>Name<input id="p_name" name="name"/></label>
          <label>Email<input id="p_email" name="email" type="email"/></label>
          <label>Phone<input id="p_phone" name="phone"/></label>
          <label>LinkedIn<input id="p_linkedin" name="linkedin"/></label>
          <label>Location<input id="p_location" name="location"/></label>
          <label>Resume Path<input id="p_resume_path" name="resume_path"/></label>
          <label>Experience (years)<input id="p_exp" name="experience_years" type="number"/></label>
          <label>Current Role<input id="p_role" name="current_role"/></label>
          <label>Current Company<input id="p_company" name="current_company"/></label>
          <label>Skills (comma-separated)<input id="p_skills" name="skills"/></label>
          <label>Target Titles (comma-separated)<input id="p_titles" name="target_titles"/></label>
          <label>Required Keywords<input id="p_req_kw" name="required_keywords"/></label>
          <label>Bonus Keywords<input id="p_bonus_kw" name="bonus_keywords"/></label>
          <label>Min Salary (Lakhs INR)<input id="p_min_salary" name="salary_min_lakhs" type="number"/></label>
          <label>Currency
            <select id="p_currency" name="salary_currency">
              <option>INR</option><option>USD</option><option>EUR</option><option>GBP</option>
            </select>
          </label>
          <label>Work Type
            <select id="p_work_type" name="work_type" multiple size="3">
              <option value="remote">Remote</option>
              <option value="hybrid">Hybrid</option>
              <option value="on-site">On-site</option>
            </select>
          </label>
          <label>Preferred Locations<input id="p_locations" name="locations"/></label>
          <label>Summary<textarea id="p_summary" name="summary" rows="3"></textarea></label>
        </div>
        <div class="modal-actions">
          <button type="submit" class="btn btn-primary">Save Profile</button>
          <button type="button" id="cancelProfileBtn" class="btn btn-ghost">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Apply Modal -->
  <div id="applyModal" class="modal" style="display:none" role="dialog" aria-modal="true" aria-label="Prepare application">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Prepare application</h2>
        <button id="closeApplyBtn" class="close" aria-label="Close dialog">&times;</button>
      </div>
      <div id="applyContent"></div>
      <div class="modal-actions">
        <a id="applyUrlBtn" href="#" target="_blank" class="btn btn-ghost">Open Job Page</a>
        <button id="markAppliedBtn" class="btn btn-primary" style="background:var(--green)">Mark as Applied</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <script src="/app.js?t=__TIMESTAMP__"></script>
</body>
</html>
