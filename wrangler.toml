name = "job-agent-web"
main = "worker.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ANTHROPIC_API_KEY = ""
RESEND_API_KEY = ""
EMAIL_TO = ""

# KV namespace for persistent storage (jobs, profile, scrape runs)
[[kv_namespaces]]
binding = "JOBS_KV"
id = "8a762a3f957f41c1bb5d3a7166442478"
preview_id = "dc97052be34d450aa1749a788964cfe1"

[triggers]
crons = ["0 2 * * *"]  # Daily at 02:00 UTC (7:30 AM IST)

[observability]
enabled = true
head_sampling_rate = 1
